openapi: 3.0.3
info:
  title: TaskFlow API
  version: 1.0.0
  description: API REST del entregable Módulo 8.
servers:
  - url: http://localhost:3000/api/v1
tags:
  - name: Auth
  - name: Users
  - name: Tasks
  - name: Projects
  - name: Upload
paths:
  /status:
    get:
      summary: Consultar estado público
      responses:
        "200": { description: API disponible }
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar una cuenta con contraseña cifrada
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
      responses:
        "201": { description: Cuenta creada }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Correo duplicado }
  /auth/login:
    post:
      tags: [Auth]
      summary: Autenticar y generar un JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200": { description: Token Bearer generado }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /users:
    get:
      tags: [Users]
      summary: Listar y filtrar usuarios
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: active, schema: { type: boolean } }
      responses:
        "200": { description: Lista de usuarios }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /users/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Users]
      summary: Obtener usuario con perfil, tareas y proyectos
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Relaciones 1:1, 1:N y N:M }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Users]
      summary: Actualizar cuenta y perfil
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                email: { type: string, format: email }
                bio: { type: string, maxLength: 240 }
      responses:
        "200": { description: Usuario actualizado }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Users]
      summary: Eliminar usuario (solo administrador)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Usuario eliminado }
        "403": { $ref: "#/components/responses/Forbidden" }
  /tasks:
    get:
      tags: [Tasks]
      summary: Listar tareas propias con filtros
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [all, pending, in_progress, completed] }
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Lista filtrada }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Tasks]
      summary: Crear tarea
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "201": { description: Tarea creada }
        "400": { $ref: "#/components/responses/BadRequest" }
  /tasks/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Tasks]
      summary: Obtener tarea propia
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Tarea obtenida }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Tasks]
      summary: Actualizar tarea propia
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "200": { description: Tarea actualizada }
    delete:
      tags: [Tasks]
      summary: Eliminar tarea propia
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Tarea eliminada }
  /projects:
    get:
      tags: [Projects]
      summary: Listar proyectos del usuario
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Proyectos obtenidos }
    post:
      tags: [Projects]
      summary: Crear proyecto y asignar propietario
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201": { description: Proyecto creado }
  /projects/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Projects]
      summary: Obtener proyecto con integrantes
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Proyecto obtenido }
    put:
      tags: [Projects]
      summary: Actualizar proyecto propio
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "200": { description: Proyecto actualizado }
    delete:
      tags: [Projects]
      summary: Eliminar proyecto propio
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Proyecto eliminado }
  /projects/{id}/members:
    post:
      tags: [Projects]
      summary: Asociar integrante a un proyecto
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer, minimum: 1 }
      responses:
        "200": { description: Integrante asociado }
  /upload:
    post:
      tags: [Upload]
      summary: Subir avatar y asociarlo al perfil autenticado
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201": { description: Avatar guardado }
        "413": { description: Archivo demasiado grande }
        "415": { description: Tipo o contenido no permitido }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    BadRequest:
      description: Validación fallida
    Unauthorized:
      description: JWT ausente, inválido o expirado
    Forbidden:
      description: Usuario autenticado sin autorización suficiente
  schemas:
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72, writeOnly: true }
        bio: { type: string, maxLength: 240 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }
    TaskInput:
      type: object
      properties:
        title: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, maxLength: 240 }
        status: { type: string, enum: [pending, in_progress, completed] }
        priority: { type: string, enum: [low, medium, high] }
        dueDate: { type: string, format: date, nullable: true }
    ProjectInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, maxLength: 240 }
